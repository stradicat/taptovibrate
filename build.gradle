// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {

    ext {
        version_appcompat = '1.6.1' // 1.6.1 -> last version compatible with API 19
        version_constraint_layout = '2.1.4' // 2.1.4 -> last version compatible with API 19
        version_core = '1.13.1' // 1.13.1 -> last version compatible with API 19
        version_coroutine = "1.3.7"
        version_fragment = "1.8.2"
        version_gradle = '8.9.1'
        version_kotlin = '2.1.20'
        version_ksp = '1.0.32'
        version_lifecycle = '2.8.7'
        version_lifecycle_extensions = "2.2.0"
        version_material = "1.12.0"
        version_navigation = "2.8.0" // for Kotlin 2.+, 2.8.0; 1.9 -> 2.7.7
        version_timber = "5.0.1"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$version_gradle"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$version_kotlin"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id "com.google.devtools.ksp" version "${version_kotlin}-${version_ksp}" apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
